<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Test - ZENNARA</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="assets/css/zenara-custom.css?v=2" rel="stylesheet">
    
    <style>
        /* Additional debug styles */
        body {
            margin: 0;
            padding: 0;
        }
        
        .debug-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
        }
        
        .content-spacer {
            height: 200vh;
            padding: 100px 20px;
            background: linear-gradient(180deg, #f5f5f5 0%, #e5e5e5 100%);
        }
    </style>
</head>

<body class="zenara-dark">
    
    <!-- Navigation -->
    <header class="zenara-header">
        <div class="container">
            <nav class="zenara-nav">
                <div class="nav-logo">
                    <a href="zennara-index-2.html">
                        <img src="logos/ZENNARA_ZPrism_Horizontal_Light.svg" alt="ZENNARA">
                    </a>
                </div>
                
                <div class="nav-toggle" id="navToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                
                <ul class="nav-menu" id="navMenu">
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#">SecureRent</a></li>
                    <li class="nav-dropdown">
                        <a href="#">Services <span class="dropdown-arrow">▾</span></a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Property Management</a></li>
                            <li><a href="#">Facility Management</a></li>
                        </ul>
                    </li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Insights</a></li>
                    <li><a href="#">Contact</a></li>
                    <li class="portal-link"><a href="#">Client Portal</a></li>
                </ul>
                
                <div class="nav-cta">
                    <a href="#" class="btn-zenara-primary">Request Proposal</a>
                </div>
            </nav>
        </div>
    </header>
    <!-- End Navigation -->
    
    <div class="content-spacer">
        <div class="container">
            <h1 style="text-align: center; padding-top: 50px; font-family: var(--font-display); font-size: 48px;">Navigation Test Page</h1>
            <p style="text-align: center; font-family: var(--font-body); font-size: 18px; max-width: 600px; margin: 20px auto;">
                Scroll to test sticky navigation. Resize browser window to test responsive behavior.
            </p>
        </div>
    </div>
    
    <div class="debug-info">
        Screen Width: <span id="screenWidth"></span>px
    </div>
    
    <script>
        // Mobile menu toggle
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');
        
        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
        }
        
        // Debug info
        function updateScreenWidth() {
            document.getElementById('screenWidth').textContent = window.innerWidth;
        }
        updateScreenWidth();
        window.addEventListener('resize', updateScreenWidth);
    </script>
</body>
</html>
